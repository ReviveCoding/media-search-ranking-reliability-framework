name: ci-final

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11.9"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints/py311.txt

      - name: Install declared dependencies
        run: python scripts/ci_install.py

      - name: Compile source and scripts
        run: python -m compileall -q src scripts

      - name: Run tests
        run: python -m pytest -q

      - name: Verify frozen release contract
        run: python scripts/verify_release_contract.py --repo .
